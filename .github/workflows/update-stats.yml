name: Update README stats

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=chasing1020&show_icons=true&theme=transparent&hide_title=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=chasing1020&hide=html,makefile,scss,tex&theme=transparent&langs_count=6&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Validate cards
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats.svg', 'top-langs.svg'):
              svg = Path('profile', name).read_text()
              root = ET.fromstring(svg)
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              content = ' '.join(root.itertext()).lower()
              for error in ('something went wrong', 'bad credentials', 'rate limit', 'could not resolve to a user'):
                  assert error not in content, f'{name}: {error}'

      - name: Commit successful update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update README stats cards'
          git pull --rebase origin main
          git push origin HEAD:main
